
name: Deploy Website to EC2

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' && secrets.EC2_USER != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip deploy when secrets are missing
        if: ${{ env.HAS_DEPLOY_SECRETS != 'true' }}
        run: echo "::warning::Deploy skipped because EC2_SSH_KEY, EC2_HOST, or EC2_USER is not configured."

      - name: Configure SSH
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host key
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy HTML to EC2
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp index.html "$EC2_USER@$EC2_HOST:/tmp/index.html"

      - name: Publish website
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            'sudo install -o root -g root -m 644 /tmp/index.html /var/www/html/index.html && sudo systemctl restart httpd'
